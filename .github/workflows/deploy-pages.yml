name: Deploy ACHETSU elections portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Sync padrón desde achetsuweb
        run: |
          curl -fsSL -o assets/padron-socios.json \
            https://raw.githubusercontent.com/estebancofre-coy/achetsuweb/main/assets/padron-socios.json \
            || echo "No se pudo actualizar el padrón; se usa la copia del repositorio."
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html CNAME _site/
          cp -r assets _site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
